<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ITARMS - Add User</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

<div class="container py-5">

    <div class="mb-4">
        <h2 class="fw-bold">Add User</h2>
        <p class="text-muted mb-0">
            Create a new ITARMS system user.
        </p>
    </div>

    <div class="card shadow-sm border-0">

        <div class="card-body p-4">

            {% if error %}
                <div
                    class="alert alert-danger alert-dismissible fade show"
                    role="alert"
                >
                    {{ error }}

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="alert"
                        aria-label="Close"
                    ></button>
                </div>
            {% endif %}

            <form method="POST">

                {% csrf_token %}

                <div class="row g-3">

                    <!-- Username -->
                    <div class="col-md-6">

                        <label
                            for="username"
                            class="form-label"
                        >
                            Username
                        </label>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            class="form-control"
                            placeholder="Enter username"
                            value="{{ request.POST.username }}"
                            required
                        >

                    </div>


                    <!-- Email -->
                    <div class="col-md-6">

                        <label
                            for="email"
                            class="form-label"
                        >
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            class="form-control"
                            placeholder="Enter email address"
                            value="{{ request.POST.email }}"
                            required
                        >

                    </div>


                    <!-- First Name -->
                    <div class="col-md-6">

                        <label
                            for="first_name"
                            class="form-label"
                        >
                            First Name
                        </label>

                        <input
                            type="text"
                            id="first_name"
                            name="first_name"
                            class="form-control"
                            placeholder="Enter first name"
                            value="{{ request.POST.first_name }}"
                        >

                    </div>


                    <!-- Last Name -->
                    <div class="col-md-6">

                        <label
                            for="last_name"
                            class="form-label"
                        >
                            Last Name
                        </label>

                        <input
                            type="text"
                            id="last_name"
                            name="last_name"
                            class="form-control"
                            placeholder="Enter last name"
                            value="{{ request.POST.last_name }}"
                        >

                    </div>


                    <!-- Role -->
                    <div class="col-md-6">

                        <label
                            for="role"
                            class="form-label"
                        >
                            Role
                        </label>

                        <select
                            id="role"
                            name="role"
                            class="form-select"
                            required
                        >

                            <option value="">
                                Select Role
                            </option>

                            <option
                                value="SUPER_ADMIN"
                                {% if request.POST.role == "SUPER_ADMIN" %}
                                    selected
                                {% endif %}
                            >
                                Super Admin
                            </option>

                            <option
                                value="IT_ADMIN"
                                {% if request.POST.role == "IT_ADMIN" %}
                                    selected
                                {% endif %}
                            >
                                IT Administrator
                            </option>

                            <option
                                value="HR_MANAGER"
                                {% if request.POST.role == "HR_MANAGER" %}
                                    selected
                                {% endif %}
                            >
                                HR Manager
                            </option>

                            <option
                                value="DEPARTMENT_MANAGER"
                                {% if request.POST.role == "DEPARTMENT_MANAGER" %}
                                    selected
                                {% endif %}
                            >
                                Department Manager
                            </option>

                            <option
                                value="EMPLOYEE"
                                {% if request.POST.role == "EMPLOYEE" %}
                                    selected
                                {% endif %}
                            >
                                Employee
                            </option>

                        </select>

                    </div>


                    <!-- Account Status -->
                    <div class="col-md-6">

                        <label
                            for="is_active"
                            class="form-label"
                        >
                            Account Status
                        </label>

                        <select
                            id="is_active"
                            name="is_active"
                            class="form-select"
                            required
                        >

                            <option
                                value="1"
                                {% if request.POST.is_active != "0" %}
                                    selected
                                {% endif %}
                            >
                                Active
                            </option>

                            <option
                                value="0"
                                {% if request.POST.is_active == "0" %}
                                    selected
                                {% endif %}
                            >
                                Inactive
                            </option>

                        </select>

                    </div>


                    <!-- Password -->
                    <div class="col-md-6">

                        <label
                            for="password"
                            class="form-label"
                        >
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="form-control"
                            placeholder="Enter password"
                            required
                        >

                    </div>


                    <!-- Confirm Password -->
                    <div class="col-md-6">

                        <label
                            for="confirm_password"
                            class="form-label"
                        >
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            id="confirm_password"
                            name="confirm_password"
                            class="form-control"
                            placeholder="Confirm password"
                            required
                        >

                    </div>

                </div>


                <!-- Buttons -->
                <div class="mt-4">

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Create User
                    </button>

                    <a
                        href="{% url 'user_management' %}"
                        class="btn btn-outline-secondary ms-2"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>

</body>
</html>
