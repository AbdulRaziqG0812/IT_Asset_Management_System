<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ITARMS - Login</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

<div class="container min-vh-100 d-flex align-items-center justify-content-center">

    <div
        class="card shadow-sm border-0"
        style="width: 100%; max-width: 430px;"
    >

        <div class="card-body p-4 p-md-5">

            <div class="text-center mb-4">

                <h2 class="fw-bold">
                    ITARMS
                </h2>

                <p class="text-muted mb-0">
                    IT Asset & Resource Management System
                </p>

            </div>

            <h4 class="fw-semibold mb-1">
                Sign In
            </h4>

            <p class="text-muted mb-4">
                Sign in to access your ITARMS account.
            </p>

            {% if error %}
                <div
                    class="alert alert-danger alert-dismissible fade show"
                    role="alert"
                >
                    {{ error }}

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="alert"
                        aria-label="Close"
                    ></button>
                </div>
            {% endif %}

            <form method="POST">

                {% csrf_token %}

                <!-- Username -->
                <div class="mb-3">

                    <label
                        for="username"
                        class="form-label"
                    >
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        class="form-control"
                        placeholder="Enter your username"
                        value="{{ request.POST.username }}"
                        required
                        autofocus
                    >

                </div>

                <!-- Password -->
                <div class="mb-4">

                    <label
                        for="password"
                        class="form-label"
                    >
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-control"
                        placeholder="Enter your password"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="btn btn-primary w-100"
                >
                    Sign In
                </button>

            </form>

        </div>

    </div>

</div>

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>

</body>
</html>
